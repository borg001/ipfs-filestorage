services:
  # Bootstrap node — lightweight peer discovery only, no user data
  ipfs-bootstrap:
    image: ipfs/kubo:latest
    container_name: ipfs-bootstrap
    volumes:
      - ipfs-bootstrap-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-bootstrap-init.sh:/usr/local/bin/ipfs-bootstrap-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_SWARM_KEY=/key/swarm.key
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-bootstrap-init.sh"]
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Storage IPFS node 1
  ipfs1:
    image: ipfs/kubo:latest
    container_name: ipfs1
    ports:
      - "15001:5001"  # IPFS API direct access
      - "14001:4001"  # Swarm TCP
      - "18081:8080"  # IPFS gateway
    volumes:
      - ipfs1-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_BOOTSTRAP_HOST=ipfs-bootstrap
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    depends_on:
      ipfs-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Storage IPFS node 2
  ipfs2:
    image: ipfs/kubo:latest
    container_name: ipfs2
    ports:
      - "15002:5001"  # IPFS API direct access
      - "14002:4001"  # Swarm TCP
      - "18082:8080"  # IPFS gateway
    volumes:
      - ipfs2-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_BOOTSTRAP_HOST=ipfs-bootstrap
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    depends_on:
      ipfs-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Storage API service 1
  storage1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage1
    ports:
      - "13001:3000"  # Storage1 API direct access
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs1:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
      - UNPIN_STORE_PATH=/data/unpin-store.json
      - AUTH_SERVICE_URL=http://host.docker.internal:8080
      - AUTH_LUA_ALLOWED_PRIVATE_HOSTS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - unpin-data-1:/data
      - ./scripts:/app/scripts:ro
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  # Storage API service 2
  storage2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage2
    ports:
      - "13002:3000"  # Storage2 API direct access
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs2:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
      - UNPIN_STORE_PATH=/data/unpin-store.json
      - AUTH_SERVICE_URL=http://host.docker.internal:8080
      - AUTH_LUA_ALLOWED_PRIVATE_HOSTS=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - unpin-data-2:/data
      - ./scripts:/app/scripts:ro
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  # Nginx load balancer (on port 8083 — 8080/8081 are used by auth/api)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - storage-net
    depends_on:
      - storage1
      - storage2

volumes:
  ipfs-bootstrap-data:
  ipfs1-data:
  ipfs2-data:
  unpin-data-1:
  unpin-data-2:

networks:
  storage-net:
    driver: bridge
