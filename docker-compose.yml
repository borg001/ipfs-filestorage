version: "3.9"

services:
  ipfs1:
    image: ipfs/kubo:latest
    container_name: ipfs1
    volumes:
      - ipfs1-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_SWARM_CONNECT=/dns4/ipfs2/tcp/4001/p2p/12D3KooWPeer2
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ipfs2:
    image: ipfs/kubo:latest
    container_name: ipfs2
    volumes:
      - ipfs2-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_SWARM_CONNECT=/dns4/ipfs1/tcp/4001/p2p/12D3KooWPeer1
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  storage1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage1
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs1:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
    volumes:
      - unpin-data:/data
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  storage2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage2
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs2:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
    volumes:
      - unpin-data:/data
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - storage-net
    depends_on:
      - storage1
      - storage2

volumes:
  ipfs1-data:
  ipfs2-data:
  unpin-data:

networks:
  storage-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
