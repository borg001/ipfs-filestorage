services:
  # Bootstrap node — lightweight peer discovery only, no user data
  ipfs-bootstrap:
    image: ipfs/kubo:latest
    container_name: ipfs-bootstrap
    volumes:
      - ipfs-bootstrap-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-bootstrap-init.sh:/usr/local/bin/ipfs-bootstrap-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_SWARM_KEY=/key/swarm.key
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-bootstrap-init.sh"]
    networks:
      - storage-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Storage IPFS node 1
  ipfs1:
    image: ipfs/kubo:latest
    container_name: ipfs1
    volumes:
      - ipfs1-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_BOOTSTRAP_HOST=ipfs-bootstrap
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    depends_on:
      ipfs-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Storage IPFS node 2
  ipfs2:
    image: ipfs/kubo:latest
    container_name: ipfs2
    volumes:
      - ipfs2-data:/data/ipfs
      - ./swarm.key:/key/swarm.key:ro
      - ./scripts/ipfs-init.sh:/usr/local/bin/ipfs-init.sh:ro
    environment:
      - IPFS_PATH=/data/ipfs
      - IPFS_PROFILE=lowpower
      - IPFS_SWARM_KEY=/key/swarm.key
      - IPFS_BOOTSTRAP_HOST=ipfs-bootstrap
    entrypoint: ["/bin/sh", "/usr/local/bin/ipfs-init.sh"]
    networks:
      - storage-net
    depends_on:
      ipfs-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--post-data=", "-O", "/dev/null", "http://localhost:5001/api/v0/id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Storage API service 1
  storage1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage1
    ports:
      - "3001:3000"   # Storage1 API on host port 3001
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs1:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
      - UNPIN_STORE_PATH=/data/unpin-store.json
    volumes:
      - unpin-data-1:/data
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  # Storage API service 2
  storage2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage2
    ports:
      - "3002:3000"   # Storage2 API on host port 3002
    env_file:
      - .env
    environment:
      - SERVER_PORT=${SERVER_PORT:-3000}
      - IPFS_URL=http://ipfs2:5001
      - CLUSTER_NODES=${CLUSTER_NODES:-http://ipfs1:5001,http://ipfs2:5001}
      - UNPIN_STORE_PATH=/data/unpin-store.json
    volumes:
      - unpin-data-2:/data
    networks:
      - storage-net
    depends_on:
      ipfs1:
        condition: service_healthy
      ipfs2:
        condition: service_healthy

  # Nginx load balancer (on port 8081 — 8080 occupied by MCP)
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - storage-net
    depends_on:
      - storage1
      - storage2

volumes:
  ipfs-bootstrap-data:
  ipfs1-data:
  ipfs2-data:
  unpin-data-1:
  unpin-data-2:

networks:
  storage-net:
    driver: bridge
