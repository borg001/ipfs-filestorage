events {
    worker_connections 1024;
}

http {
    # Media addresses may carry the session token: the log keeps the address
    # with the token cut out.
    map $request_uri $storage_log_uri {
        ~^(?<log_path>[^?]*)\?(?<log_before>(?:[^&]*&)*?)(?<log_key>(?:access_)?token)=[^&]*(?<log_after>.*)$ "${log_path}?${log_before}${log_key}=REDACTED${log_after}";
        default $request_uri;
    }
    log_format storage_redacted '$remote_addr - $remote_user [$time_local] "$request_method $storage_log_uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log storage_redacted;

    upstream storage_backend {
        server storage1:3000;
        server storage2:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 1g;

        # Video streaming endpoints — no buffering
        location /stream/ {
            proxy_pass http://storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Long video upload: network transfer, transcoding and IPFS writes can
        # take substantially longer than a normal file operation.
        location = /upload-video {
            proxy_pass http://storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 2400s;
            proxy_read_timeout 2400s;
        }

        # Upload and general API
        location / {
            proxy_pass http://storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Video uploads include server-side transcoding and poster generation.
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
