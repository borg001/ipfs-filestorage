events {
    worker_connections 1024;
}

http {
    upstream storage_backend {
        server storage1:3000;
        server storage2:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Video streaming endpoints — no buffering
        location /stream/ {
            proxy_pass http://storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Upload and general API
        location / {
            proxy_pass http://storage_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Video uploads include server-side transcoding and poster generation.
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
